# fly.toml — Fly.io configuration for the hosted TradingTransformer API
# (Phase 7.4). Deploy with scripts/deploy_api.sh.

app = "tradingtransformer-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one machine warm: cold starts must serve /api/health within 5 s
  # (PHASE_7.md exit criterion) and the LRU pre-warm takes minutes.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[mounts]]
  source = "model_artefacts"
  destination = "/app/models"

[[vm]]
  size = "shared-cpu-1x"

[env]
  PROJECT_ROOT = "/app"
  MAX_CONCURRENT_BACKTESTS = "2"
  # Secrets (set via `flyctl secrets set`, never here):
  #   API_KEYS               — comma-separated client keys
  #   ANTHROPIC_API_KEY      — context-extraction LLM fallback
  #   ALLOWED_EXTENSION_IDS  — published CWS extension ID (ADR-043)
