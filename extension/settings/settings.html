<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TradingTransformer Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <h2>TradingTransformer</h2>
  <p class="subtitle">API and dashboard connection settings</p>

  <label>API Base URL
    <input id="api-base" type="text" placeholder="https://api.tradingtransformer.com">
  </label>

  <label>API Key <span style="color:#64748b">(leave empty for a local server)</span>
    <input id="api-key" type="password" placeholder="key_..." autocomplete="off">
  </label>

  <label>Dashboard Base URL
    <input id="dashboard-base" type="text" placeholder="http://localhost:8501">
  </label>

  <div class="buttons">
    <button id="test" class="secondary">Test Connection</button>
    <button id="save">Save</button>
  </div>
  <div id="status"></div>

  <script src="validation.js"></script>
  <script src="settings.js"></script>
</body>
</html>
