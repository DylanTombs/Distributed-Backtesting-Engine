name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (full style — API and context layers)
        # E221/E272: column-aligned assignment blocks are the house style in
        # runner.py — the alignment is deliberate, not stray whitespace.
        # events.py is a curated data table; wrapping its descriptions hurts.
        run: |
          flake8 research/api research/context research/data \
            --count --max-line-length=100 \
            --extend-ignore=E203,W503,E221,E272 \
            --per-file-ignores=research/context/events.py:E501 \
            --statistics

      - name: Test with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=research \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
